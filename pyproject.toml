[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforge-api"
version = "1.0.0"
description = "A dependency-free Python observability service built for backend interview practice"
requires-python = ">=3.11"
authors = [{name = "Interview Practice"}]

[tool.setuptools.packages.find]
where = ["src"]

